name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate app
        run: npm run validate

      - name: Use Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Firebase Security Rules
        run: npm run firebase:rules:test

      - name: Test profile bootstrap contract
        run: npm run firebase:profile:test

      - name: Test appointment booking contract
        run: npm run firebase:booking:test

      - name: Test appointment management contract
        run: npm run firebase:appointment-management:test

      - name: Test notification token contract
        run: npm run firebase:notification-token:test

      - name: Test scheduled reminder delivery
        run: npm run firebase:appointment-reminders:test
